<div id="app">

    <div id="stage">
      <div id="frame"></div>
      <canvas id="gl"></canvas>

<script>
/* ثيم مبكر لتفادي الوميض (مع حماية من وضع المعاينة المقيد) */
try {
  var t = JSON.parse(localStorage.getItem('curve-studio.v1') || 'null');
  if (t && t.ui && t.ui.theme === 'dark') document.documentElement.dataset.theme = 'dark';
} catch (e) { }
</script>
